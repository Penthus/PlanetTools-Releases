name: Verify and promote private build

on:
  repository_dispatch:
    types: [promote_release]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  promote:
    if: github.event.sender.login == 'Penthus'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.client_payload.tag }}
      EXPECTED_ASSETS_JSON: ${{ toJSON(github.event.client_payload.assets) }}
      GH_TOKEN: ${{ github.token }}
      ALLOW_UNSIGNED_RELEASES: ${{ vars.ALLOW_UNSIGNED_RELEASES }}
    steps:
      - name: Check out public verification policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require an accepted public license
        shell: pwsh
        run: |
          if (-not (Test-Path LICENSE -PathType Leaf)) {
            throw "Public promotion is blocked until an accepted LICENSE is committed."
          }
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          architecture: x64
      - name: Test public verification policy
        run: python -m unittest discover -s tests -v
      - name: Select exact unpublished draft and download assets
        id: draft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = $env:EXPECTED_ASSETS_JSON | ConvertFrom-Json
          $release = $null
          for ($attempt = 1; $attempt -le 24 -and $null -eq $release; $attempt++) {
            $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
            foreach ($candidate in @($releases | Where-Object { $_.tag_name -eq $env:TAG -and $_.draft })) {
              $matches = @($candidate.assets).Count -eq @($expected.PSObject.Properties).Count
              foreach ($property in $expected.PSObject.Properties) {
                $asset = @($candidate.assets) | Where-Object { $_.name -eq $property.Name } | Select-Object -First 1
                if ($null -eq $asset -or $asset.digest -ne "sha256:$($property.Value)") { $matches = $false }
              }
              if ($matches) { $release = $candidate; break }
            }
            if ($null -eq $release -and $attempt -lt 24) { Start-Sleep -Seconds 5 }
          }
          if ($null -eq $release) { throw "Exact draft assets were not visible after two minutes" }
          "release_id=$($release.id)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          New-Item -ItemType Directory incoming | Out-Null
          $headers = @{Accept="application/octet-stream";Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          foreach ($asset in $release.assets) {
            if ([IO.Path]::GetFileName($asset.name) -ne $asset.name) { throw "Unsafe asset name" }
            Invoke-WebRequest -Uri $asset.url -Headers $headers -OutFile "incoming/$($asset.name)"
          }
      - name: Verify exact assets and manifest
        shell: pwsh
        run: |
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:EXPECTED_ASSETS_JSON))
          python scripts/verify_release.py --tag $env:TAG --assets incoming --expected-json-base64 $encoded
      - name: Enforce signing decision and install silently
        id: install
        shell: pwsh
        run: |
          $manifest = Get-Content incoming/release-manifest.json -Raw | ConvertFrom-Json
          $installer = Join-Path incoming $manifest.installer.name
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($manifest.authenticode_signed -and $signature.Status -ne 'Valid') {
            throw "Manifest claims signing but Authenticode validation failed."
          }
          if (-not $manifest.authenticode_signed -and $env:ALLOW_UNSIGNED_RELEASES -ne 'true') {
            throw "Unsigned public promotion is blocked until ALLOW_UNSIGNED_RELEASES is explicitly true."
          }
          $installRoot = Join-Path $env:RUNNER_TEMP 'PlanetTools-Verified'
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=$installRoot"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)." }
          "installer=$installer" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "install_root=$installRoot" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify installed files and versions
        shell: pwsh
        env:
          INSTALL_ROOT: ${{ steps.install.outputs.install_root }}
        run: |
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:EXPECTED_ASSETS_JSON))
          python scripts/verify_release.py --tag $env:TAG --assets incoming --installed-root $env:INSTALL_ROOT --expected-json-base64 $encoded
          $expectedVersion = $env:TAG.Substring(1) + '.0'
          foreach ($relative in @('PlanetSniffer.Wpf\PlanetSniffer.Wpf.exe','PlanetCollection.Wpf\PlanetCollection.Wpf.exe')) {
            $actual = (Get-Item -LiteralPath (Join-Path $env:INSTALL_ROOT $relative)).VersionInfo.FileVersion
            if ($actual -ne $expectedVersion) { throw "$relative version $actual does not match $expectedVersion" }
          }
      - name: Attest promoted installer
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.install.outputs.installer }}
      - name: Attest installed applications
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            ${{ steps.install.outputs.install_root }}/PlanetSniffer.Wpf/PlanetSniffer.Wpf.exe
            ${{ steps.install.outputs.install_root }}/PlanetCollection.Wpf/PlanetCollection.Wpf.exe
      - name: Remove stale drafts and publish selected release
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          foreach ($stale in @($releases | Where-Object { $_.tag_name -eq $env:TAG -and $_.draft -and "$($_.id)" -ne $env:RELEASE_ID })) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($stale.id)"
            if ($LASTEXITCODE -ne 0) { throw "Could not remove stale draft $($stale.id)" }
          }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F draft=false -F make_latest=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not publish verified draft" }
